<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehreen Fatima | AI Engineer</title>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #090711;
    color: #f5f3ff;
    line-height: 1.7;
}

header {
    background: linear-gradient(135deg, #100b20, #21103d, #100b20);
    padding: 75px 20px;
    text-align: center;
    border-bottom: 1px solid #7138b8;
}

header h1 {
    font-size: 46px;
    color: #ffffff;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 20px #a855f7;
}

header p {
    font-size: 18px;
    margin-top: 12px;
    color: #d8c5f5;
}

.tag {
    background: linear-gradient(90deg, #7c3aed, #c084fc);
    color: white;
    padding: 10px 24px;
    border-radius: 30px;
    display: inline-block;
    margin-top: 20px;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 0 20px #7c3aed66;
}

nav {
    background: #100b1d;
    padding: 18px;
    text-align: center;
    border-top: 1px solid #372052;
    border-bottom: 1px solid #372052;
    position: sticky;
    top: 0;
    z-index: 100;
}

nav a {
    margin: 0 12px;
    color: #d8b4fe;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    transition: 0.3s;
}

nav a:hover {
    color: #ffffff;
    text-shadow: 0 0 12px #c084fc;
}

.wrap {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

.card {
    background: linear-gradient(145deg, #191229, #100d1b);
    padding: 35px;
    border-radius: 18px;
    margin: 25px 0;
    border: 1px solid #49306b;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #a855f7;
    box-shadow: 0 10px 35px #7c3aed30;
}

h2 {
    color: #c084fc;
    font-size: 27px;
    margin-bottom: 18px;
}

h3 {
    color: #d8b4fe;
    margin-bottom: 12px;
}

p {
    color: #d1c9df;
    font-size: 16px;
    margin-bottom: 12px;
}

a {
    color: #c084fc;
}

button {
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    color: white;
    border: none;
    padding: 13px 28px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #a855f7;
}

img {
    max-width: 100%;
    border-radius: 15px;
}

footer {
    background: #100b1d;
    color: #c084fc;
    text-align: center;
    padding: 25px;
    border-top: 1px solid #49306b;
    margin-top: 35px;
}

::selection {
    background: #9333ea;
    color: white;
}

@media (max-width: 600px) {
    header {
        padding: 50px 15px;
    }

    header h1 {
        font-size: 32px;
    }

    header p {
        font-size: 15px;
    }

    nav a {
        display: inline-block;
        margin: 7px;
        font-size: 13px;
    }

    .wrap {
        padding: 15px;
    }

    .card {
        padding: 22px;
    }

    h2 {
        font-size: 23px;
    }
}
